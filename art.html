<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art - Matthew A. Cottrell</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Rosarivo:ital@0;1&display=swap"
    rel="stylesheet">

  <link rel="icon" href="img/favicon.png" />
  <link rel="stylesheet" href="styles.css?v=20260720" />
</head>

<body>
  <script>(function(){var t=localStorage.getItem('site-theme');if(!['default','bolder','shadcn','brutal'].includes(t))t='default';document.documentElement.setAttribute('data-theme',t);}());</script>

  <div id="header"></div>

  <main id="art-main">

    <!-- View Switcher & Chart Section -->
    <section class="art-controls reveal"
      style="width: 100%; max-width: 1000px; margin: 0 auto 40px; padding: 0 20px; display: flex; flex-direction: column; gap: 20px;">
      <div class="view-switcher" style="display: flex; gap: 10px; justify-content: flex-end;">
        <button id="btn-view-grid" class="tab-btn active" onclick="switchView('grid')">Grid View</button>
        <button id="btn-view-timeline" class="tab-btn" onclick="switchView('timeline')">Timeline View</button>
      </div>

      <!-- Timeline (hidden by default in Grid view) -->
      <div id="art-chart-container" style="display: none;">
        <div id="art-timeline" class="art-timeline"></div>
      </div>
    </section>

    <!-- Art Grid Container -->
    <div id="art-grid">
      <!-- Content will be injected here by JS -->
    </div>

  </main>

  <div id="footer"></div>

  <script>
    async function loadPartials() {
      const header = await fetch("header.html");
      const footer = await fetch("footer.html");
      document.getElementById("header").innerHTML = await header.text();
      document.getElementById("footer").innerHTML = await footer.text();
      var currentPage = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-links .header-link, .nav-drawer-links .header-link').forEach(function (link) {
        if (link.getAttribute('href') === currentPage) {
          link.classList.add('active');
          link.setAttribute('aria-current', 'page');
        }
      });
      var select = document.getElementById('theme-select');
      if (select) {
        select.value = document.documentElement.getAttribute('data-theme') || 'default';
        select.addEventListener('change', function () {
          document.documentElement.setAttribute('data-theme', this.value);
          localStorage.setItem('site-theme', this.value);
        });
      }
    }
    loadPartials();

    // Art Page Logic
    let artData = [];

    async function loadArtData() {
      try {
        const response = await fetch('data/art_data.json');
        artData = await response.json();
        renderGrid(artData);
        renderTimeline(artData);
      } catch (error) {
        console.error('Error loading art data:', error);
      }
    }

    function renderTimeline(data) {
      const el = document.getElementById('art-timeline');
      const sorted = [...data].sort((a, b) => a.year - b.year);
      const years = sorted.map(d => d.year);
      const pad = Math.max(4, Math.round((Math.max(...years) - Math.min(...years)) * 0.1));
      const minYear = Math.floor((Math.min(...years) - pad) / 10) * 10;
      const maxYear = Math.ceil((Math.max(...years) + pad) / 10) * 10;
      const span = maxYear - minYear;
      const pct = (year) => ((year - minYear) / span) * 100;

      const ticks = [];
      for (let y = minYear; y <= maxYear; y += 10) ticks.push(y);

      el.innerHTML = `
        <div class="timeline-track">
          ${ticks.map((y, i) => `
            <div class="timeline-tick" style="left:${pct(y)}%">
              ${i === 0 || i === ticks.length - 1 ? `<span class="timeline-tick-label">${y}</span>` : ''}
            </div>
          `).join('')}
          ${sorted.map((item, i) => `
            <div class="timeline-point ${i % 2 === 0 ? 'above' : 'below'}" style="left:${pct(item.year)}%">
              <span class="timeline-marker" title="${item.film} (${item.year}), dir. ${item.director}"></span>
              <div class="timeline-label">
                <span class="timeline-label-title rosarivo-regular-italic">${item.film}</span>
                <span class="timeline-label-year">${item.year}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderGrid(data) {
      const gridContainer = document.getElementById('art-grid');
      gridContainer.innerHTML = data.map(item => `
        <section class="art-entry">
          <div class="art-visual-wrapper ${item.bgClass}">
            <div class="art-visual" style="background-image: url('${item.image}');"></div>
          </div>
          <div class="art-content">
            <blockquote class="art-quote rosarivo-regular">
              ${item.quote}
            </blockquote>
            <div class="art-details red-hat">
              <div class="detail-row">
                <span class="detail-label">Film</span>
                <span class="detail-value">${item.film}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Director</span>
                <span class="detail-value">${item.director}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Character</span>
                <span class="detail-value">${item.character}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Run Time</span>
                <span class="detail-value">${item.runTime}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Actor</span>
                <span class="detail-value">${item.actor}</span>
              </div>
              <div class="detail-row">
                <span class="detail-label">Year</span>
                <span class="detail-value">${item.year}</span>
              </div>
            </div>
          </div>
        </section>
      `).join('');
    }

    // View Switcher Logic
    window.switchView = function (view) {
      const gridBtn = document.getElementById('btn-view-grid');
      const timelineBtn = document.getElementById('btn-view-timeline');
      const chartContainer = document.getElementById('art-chart-container');
      const gridContainer = document.getElementById('art-grid');

      if (view === 'timeline') {
        gridBtn.classList.remove('active');
        timelineBtn.classList.add('active');
        chartContainer.style.display = 'block';
        // Optional: Hide grid in timeline view? User asked for "Chart at the top", 
        // but "View Switcher" implies toggling. I'll keep grid visible or toggle it?
        // User said: "give me the ability to switch between the current art.html and the new page we are creating."
        // "New Art page... add a chart at the top".
        // Let's interpret "Timeline View" as showing the Chart AND the Grid, 
        // and "Grid View" as just the Grid (or maybe Chart is hidden).
        // Actually, let's make Timeline View show the Chart, and Grid View hide it.
        // The Grid is the main content.
      } else {
        gridBtn.classList.add('active');
        timelineBtn.classList.remove('active');
        chartContainer.style.display = 'none';
      }
    };

    // Initialize
    loadArtData();
  </script>
  <script src="nav.js"></script>
</body>

</html>
