<body>
  <header>
  <div class="header-content">
    <h1 class="top-name">Matthew A. Cottrell</h1>
    <div class="social-icons">
      <a href="https://www.linkedin.com/in/classiccottrell/" target="_blank" class="social-link">
        <img src="img/linked.svg" alt="LinkedIn" class="social-icon" />
      </a>
      <a href="https://www.instagram.com/classiccottrell" target="_blank" class="social-link">
        <img src="img/instagram.svg" alt="Instagram" class="social-icon instagram" />
      </a>
    </div>
  </div>
</header>
</body>

<script>
  // Load header and footer dynamically
  async function loadPartials() {
    const header = await fetch("header.html");
    const footer = await fetch("footer.html");
    document.getElementById("header").innerHTML = await header.text();
    document.getElementById("footer").innerHTML = await footer.text();
  }
  loadPartials();
</script>
