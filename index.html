<!DOCTYPE html>
<html lang="en">

<body>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matthew A. Cottrell</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Rosarivo:ital@0;1&family=Inter:wght@300..700&display=swap"
      rel="stylesheet">

    <link rel="icon" href="img/favicon.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css?v=20260627" />
  </head>

  <body class="home-page">
    <script>(function(){if(localStorage.getItem('theme')==='shadcn')document.body.classList.add('theme-shadcn');}());</script>
    <div id="header"></div>


    <main class="home-grid">
      <div class="profile-section">
        <img src="img/Imag-Matthew.png" alt="Matthew A. Cottrell" class="profile-img" />
      </div>

      <nav class="hero-nav">
        <a href="art.html" class="hero-link rosarivo-regular-italic">Art</a>
        <a href="writing.html" class="hero-link rosarivo-regular-italic">Writing</a>
        <!-- TODO: Add Work link -->
        <!-- <a href="index.html" class="hero-link rosarivo-regular-italic">Work</a> -->
      </nav>

      <section class="intro">
        <h2 class="headline rosarivo-regular">
          I design world-class enterprise products that feel effortless to use.
        </h2>
        <p class="subtext red-hat">
          Currently seven years into designing enterprise IT software, I’ve learned how to make complex systems feel
          simple.
        </p>
      </section>
    </main>


    <div id="footer"></div>

  </body>

  <script>
    async function loadPartials() {
      const header = await fetch("header.html");
      const footer = await fetch("footer.html");
      document.getElementById("header").innerHTML = await header.text();
      document.getElementById("footer").innerHTML = await footer.text();
      var btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.addEventListener('click', function() {
        var isActive = document.body.classList.toggle('theme-shadcn');
        localStorage.setItem('theme', isActive ? 'shadcn' : 'default');
      });
    }
    loadPartials();
  </script>

</html>
