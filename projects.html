<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects - Matthew A. Cottrell</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Rosarivo:ital@0;1&display=swap"
    rel="stylesheet">

  <link rel="icon" href="img/favicon.png" id="favicon" />
  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var icon = document.getElementById('favicon');
      var frames = ['img/favicon.png', 'img/Fav-con-terry.png', 'img/Fav-con-terry1.png', 'img/Fav-con-terry2.png', 'img/Fav-con-terry3.png', 'img/Fav-con-terry4.png'];
      var i = 0;
      setInterval(function () {
        i = (i + 1) % frames.length;
        icon.href = frames[i];
      }, 3000);
    }());
  </script>
  <link rel="stylesheet" href="styles.css?v=20260806" />
</head>

<body class="projects-page">
  <script>(function(){function fromCookie(){var m=document.cookie.split('; ').find(function(r){return r.indexOf('site-theme=')===0;});return m?decodeURIComponent(m.split('=')[1]):null;}var vals=['default','bolder','shadcn','brutal'];var t=fromCookie();if(!vals.includes(t))t=localStorage.getItem('site-theme');if(!vals.includes(t))t='default';document.documentElement.setAttribute('data-theme',t);}());</script>

  <div id="header"></div>

  <main class="projects-shell">
    <nav class="projects-nav reveal" aria-label="Projects"></nav>
    <div class="project-detail" id="project-detail"></div>
  </main>

  <div id="footer"></div>

  <script>
    async function loadPartials() {
      const header = await fetch("header.html?v=20260806");
      const footer = await fetch("footer.html?v=20260806");
      document.getElementById("header").innerHTML = await header.text();
      document.getElementById("footer").innerHTML = await footer.text();
      var currentPage = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-links .header-link, .nav-drawer-links .header-link').forEach(function (link) {
        if (link.getAttribute('href') === currentPage) {
          link.classList.add('active');
          link.setAttribute('aria-current', 'page');
        }
      });
      var select = document.getElementById('theme-select');
      if (select) {
        select.value = document.documentElement.getAttribute('data-theme') || 'default';
        select.addEventListener('change', function () {
          document.documentElement.setAttribute('data-theme', this.value);
          localStorage.setItem('site-theme', this.value);
          document.cookie = 'site-theme=' + this.value + '; domain=.classiccottrell.ca; path=/; max-age=31536000; samesite=lax';
        });
      }
    }
    loadPartials();

    // Projects Page Logic
    let projects = [];

    function normalizeProject(project) {
      if (Array.isArray(project.repos)) return project;
      return { ...project, repos: project.repo ? [{ label: project.title, url: project.repo }] : [] };
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderNav(activeId) {
      const nav = document.querySelector('.projects-nav');
      // Rebuild markup only once; afterwards just flip .active so the
      // mobile carousel's scroll position survives re-selection (a full
      // innerHTML replace would reset scrollLeft to 0 on every tap).
      if (nav.children.length !== projects.length) {
        nav.innerHTML = projects.map(p => `
            <a href="#${p.id}" class="project-nav-item" data-id="${p.id}">
              <span class="project-nav-status">${escapeHtml(p.status)}</span>
              <span class="project-nav-title rosarivo-regular">${escapeHtml(p.title)}</span>
            </a>
          `).join('');
      }
      nav.querySelectorAll('.project-nav-item').forEach(item => {
        item.classList.toggle('active', item.dataset.id === activeId);
      });
    }

    function renderSection(section) {
      if (section.heading) {
        const intro = section.intro ? `<p>${escapeHtml(section.intro)}</p>` : '';
        const items = (section.items || []).map(item => `
          <li><strong>${escapeHtml(item.lead)}</strong> ${escapeHtml(item.text)}</li>
        `).join('');
        const outro = section.outro ? `<p>${escapeHtml(section.outro)}</p>` : '';
        return `
          <section>
            <h2>${escapeHtml(section.heading)}</h2>
            ${intro}
            <ul>${items}</ul>
            ${outro}
          </section>
        `;
      }
      return `
        <section>
          ${(section.paragraphs || []).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
        </section>
      `;
    }

    function renderProduct(project) {
      if (!project.image && !project.product) return '';
      const image = project.image
        ? `<img class="project-product-image reveal" style="--d:1" src="${escapeHtml(project.image)}" alt="${escapeHtml(project.title)} product photo" loading="lazy">`
        : '';
      const buyCta = project.product
        ? `<a href="${escapeHtml(project.product.url)}" target="_blank" class="project-buy-cta">${escapeHtml(project.product.label)} &rarr;</a>`
        : '';
      return `
        <div class="project-product">
          ${image}
          ${buyCta}
        </div>
      `;
    }

    function renderDetail(project) {
      const detail = document.getElementById('project-detail');
      detail.innerHTML = `
        <p class="writing-card-date reveal">${escapeHtml(project.status)}</p>
        <div class="project-heading-row">
          <div class="project-heading-text">
            <h1 class="project-title rosarivo-regular reveal" style="--d:1">${escapeHtml(project.title)}</h1>
            <p class="project-subtitle reveal" style="--d:2">${escapeHtml(project.subtitle)}</p>
          </div>
          <div class="project-repo-links">
            ${project.repos.map(r => `
              <a href="${r.url}" target="_blank" class="project-repo-link" aria-label="${escapeHtml(r.label)} on GitHub">
                <span class="project-repo-icon" aria-hidden="true"></span>
                ${project.repos.length > 1 ? `<span class="project-repo-label">${escapeHtml(r.label)}</span>` : ''}
              </a>
            `).join('')}
          </div>
        </div>
        ${renderProduct(project)}
        ${project.sections.map(renderSection).join('')}
        ${project.ctaUrl ? `
        <section>
          <p class="project-cta">
            <a href="${project.ctaUrl}" target="_blank" class="header-link">${escapeHtml(project.ctaLabel)} &rarr;</a>
          </p>
        </section>` : ''}
      `;
      detail.scrollTop = 0;
    }

    function selectProject(id) {
      const project = projects.find(p => p.id === id) || projects[0];
      if (!project) return;
      renderNav(project.id);
      renderDetail(project);
    }

    async function loadProjects() {
      try {
        const response = await fetch('data/projects_data.json?v=20260806');
        projects = (await response.json()).map(normalizeProject);
        const initialId = location.hash.replace('#', '') || (projects[0] && projects[0].id);
        selectProject(initialId);
      } catch (error) {
        console.error('Error loading projects data:', error);
      }
    }

    document.addEventListener('click', function (e) {
      const link = e.target.closest('.project-nav-item');
      if (!link) return;
      e.preventDefault();
      const id = link.dataset.id;
      location.hash = id;
      selectProject(id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('hashchange', function () {
      const id = location.hash.replace('#', '');
      if (id) selectProject(id);
    });

    loadProjects();
  </script>
  <script src="nav.js"></script>
</body>

</html>
