<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matthew A. Cottrell</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Rosarivo:ital@0;1&display=swap"
    rel="stylesheet">

  <link rel="icon" href="img/favicon.png" id="favicon" />
  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var icon = document.getElementById('favicon');
      var frames = ['img/favicon.png', 'img/Fav-con-terry.png', 'img/Fav-con-terry1.png', 'img/Fav-con-terry2.png', 'img/Fav-con-terry3.png', 'img/Fav-con-terry4.png'];
      var i = 0;
      setInterval(function () {
        i = (i + 1) % frames.length;
        icon.href = frames[i];
      }, 3000);
    }());
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css?v=20260826" />
</head>

<body class="home-page">
  <script>(function(){function fromCookie(){var m=document.cookie.split('; ').find(function(r){return r.indexOf('site-theme=')===0;});return m?decodeURIComponent(m.split('=')[1]):null;}var vals=['default','bolder','shadcn','brutal'];var t=fromCookie();if(!vals.includes(t))t=localStorage.getItem('site-theme');if(!vals.includes(t))t='default';document.documentElement.setAttribute('data-theme',t);}());</script>
  <div id="header"></div>


  <main class="home">
    <section class="hero reveal">
      <h2 class="headline rosarivo-regular">
        I design world-class enterprise products that feel effortless to use.
      </h2>
      <p class="subtext red-hat">
        Currently seven years into designing enterprise IT software, I’ve learned how to make complex systems feel
        simple.
      </p>
    </section>

    <section class="showcase">
      <figure class="profile-section reveal" style="--d:1">
        <img src="img/Imag-Matthew.png" alt="Matthew A. Cottrell" class="profile-img" />
      </figure>

      <nav class="hero-nav reveal" style="--d:2" aria-label="Sections">
        <a href="art.html" class="hero-link rosarivo-regular-italic">
          Art
          <span class="hero-link-meta">Paintings &amp; drawings</span>
        </a>
        <a href="writing.html" class="hero-link rosarivo-regular-italic">
          Writing
          <span class="hero-link-meta">Essays on design &amp; AI</span>
        </a>
        <a href="projects.html" class="hero-link rosarivo-regular-italic">
          Projects
          <span class="hero-link-meta">Case studies &amp; tools</span>
        </a>
      </nav>
    </section>
  </main>


  <div id="footer"></div>

  <script>
    async function loadPartials() {
      const header = await fetch("header.html?v=20260806");
      const footer = await fetch("footer.html?v=20260806");
      document.getElementById("header").innerHTML = await header.text();
      document.getElementById("footer").innerHTML = await footer.text();
      var currentPage = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.nav-links .header-link, .nav-drawer-links .header-link').forEach(function (link) {
        if (link.getAttribute('href') === currentPage) {
          link.classList.add('active');
          link.setAttribute('aria-current', 'page');
        }
      });
      var select = document.getElementById('theme-select');
      if (select) {
        select.value = document.documentElement.getAttribute('data-theme') || 'default';
        select.addEventListener('change', function () {
          document.documentElement.setAttribute('data-theme', this.value);
          localStorage.setItem('site-theme', this.value);
          document.cookie = 'site-theme=' + this.value + '; domain=.classiccottrell.ca; path=/; max-age=31536000; samesite=lax';
        });
      }
    }
    loadPartials();
  </script>
  <script src="nav.js"></script>
  <script src="particles.js?v=20260826"></script>
</body>

</html>
