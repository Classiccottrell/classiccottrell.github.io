<!--
  dark-nebula — one billowed dust cloud coming in from the left edge, carved
  out of a stippled starfield as pure negative space, its upper-right face
  lit by a hidden star as stipple and fine hairline wisps.

  Text-safe zone: the dark body of the cloud, left. Nothing is drawn there
  but a few dimmed stars where the cloud thins.
  Anchor: one young star just inside the brightest stretch of the rim, left
  of centre, lighting its own pocket of dust. It holds still; the three star
  layers drift behind the cloud on 4, 7 and 13 px parallax ellipses, the
  veils in the cloud's fringe thicken and thin, and the lit face ripples, all
  on one seamless 32 s loop at Speed 1.

  Technique: the cloud is a column-density field on a 2 px grid (an opaque
  billowed core, ridged-noise fibres and a soft veil). Light from the hidden
  star is marched through the core, and the lit gas is sampled as stipple
  dots. Wisps are short hairlines traced along the density's iso-lines where
  the light is strongest. Every star is dimmed by exp(-density), so the cloud
  exists only as missing and dimmed stars. All of it is built once per
  framing (canvas size, Scale, Angle) in screen space with Angle applied, so
  nothing is rotated with ctx.rotate.

  Controls: Scale sizes the cloud about its anchor (contained at 0, bleeding
  off three edges at 2). Density takes a prefix of every dot list (stars,
  haze, stipple), Stroke sets dot size and wisp width, Rim sets the hidden
  star's light on the lit face and wisps, Motion scales every drift and
  shimmer, Glow adds a halo round the anchor and a soft underlay to the
  wisps. In gradient mode the lit gas takes Color A and the starfield Color B.

  SVG export: the wisps as polylines, plus an evenly thinned sample of the
  stipple and star dots as circles (capped at 12,000, faint ones dropped),
  with the anchor.
  The full field of a hundred thousand dots stays raster: use PNG for it.
-->

function kindOf(spec) {

  // Mobile-sheet collapse is a separate, unpersisted flag: it starts
  // collapsed every load (handle-only, per the brief) and is scoped to the

  // affected by) the desktop `collapsed` state above.

    headBtn.className = 'lf-section-head';

    // for a programmatic write to the hidden field itself (see applyValues,

const ANIM_DT_CLAMP_SECONDS = 0.1;

function createLoop({ onFrame, speed = 1 }) {
  let running = false;
  let paused = false;
  let lastTime = 0;
  let elapsed = 0;
  let rafId = null;
  let currentSpeed = speed;

  function tick(now) {
    if (!running || paused) return;
    const rawDt = lastTime ? (now - lastTime) / 1000 : 0;
    const clampedDt = Math.min(Math.max(rawDt, 0), ANIM_DT_CLAMP_SECONDS);
    lastTime = now;
    const scaledDt = clampedDt * currentSpeed;
    elapsed += scaledDt;
    onFrame(scaledDt, elapsed);
    rafId = requestAnimationFrame(tick);
  }

  function handleVisibilityChange() {
    if (typeof document === 'undefined') return;
    if (document.hidden) {
      paused = true;
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }

      paused = false;
      // Reset the sentinel instead of computing a real dt, so resume doesn't
      // produce a giant catch-up frame — same reasoning as start()'s reset.
      lastTime = 0;
      rafId = requestAnimationFrame(tick);
    }
  }

  return {
    start() {
      if (running) return;
      running = true;
      paused = false;
      lastTime = 0;
      if (typeof document !== 'undefined') {
        document.addEventListener('visibilitychange', handleVisibilityChange);
      }
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      paused = false;

// Scanning only the piece script is exactly the hand-maintained-list failure
// this function's own comment already warns about, one level removed: a
// shared module's OWN imports were invisible to it, so a new cross-shared-
// module import survived verbatim into a classic (non-module) inline script.
//
// BFS discovery order is not enough once a shared module reads another
// shared module's binding at TOP LEVEL (module-evaluation time), not just
// inside a function body called later. controls.js is always a piece's
// first import, so BFS always placed it first in the concatenated output —
// fine for `hexToHue` (from color.js), which is only called inside
// `setValue`, deferred to call time. A shared module that reads an imported
// binding at top level instead must have that dependency emitted first.
//
// A post-order DFS guarantees every module's dependencies appear before it
// in the emitted output, independent of whether the consumer reads the
// dependency's binding at top level or lazily inside a function — the
// general fix, not a per-call-site workaround. See
// skills/building-generative-backgrounds/SKILL.md, "Inlining and bundling".
async function inlineSharedModules(pieceScriptSrc) {
  const strippedPieceSrc = pieceScriptSrc.replace(SHARED_IMPORT_RE, '');
  const initial = [...pieceScriptSrc.matchAll(SHARED_IMPORT_RE)].map((m) => m[1]);
  if (!initial.length) {
    throw new Error('bakeHtml: the piece imports no shared modules — refusing to bake a file that would render blank');
  }

  const srcByPath = new Map();
  const order = []; // post-order: a module's dependencies land before it
  const done = new Set();
  const visiting = new Set(); // cycle guard — a real cycle would recurse forever otherwise

  async function visit(path) {
    if (done.has(path)) return;
    if (visiting.has(path)) {
      throw new Error(`bakeHtml: circular shared-module import detected at ${path}`);
    }
    visiting.add(path);
    const res = await fetch(path);
    if (!res.ok) throw new Error(`bakeHtml: could not fetch ${path} (${res.status})`);
    const src = await res.text();
    srcByPath.set(path, src);

    // '../../shared/foo.js' form the piece-level regex produces, so a module
    // reached both ways (e.g. color.js: directly by the piece, and via
    // controls.js) is only ever inlined once.
    const inner = [...src.matchAll(INNER_SHARED_IMPORT_RE)].map((m) => `../../shared/${m[1]}`);

    done.add(path);

      if (kind === 'haze') { if (x >= 0 && y >= 0 && x < W && y < H) accS[y * W + x] += a; }
      else dot(kind === 'gas' ? accC : accS, W, H, x, y, a, f.spread, big);
    });
    // The anchor: a pixel-centred point with a tight falloff.
    const [ax, ay] = sc.anchor;
    for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
      const d2 = ox * ox + oy * oy, w = d2 === 0 ? 1 : d2 <= 2 ? 0.42 : d2 <= 5 ? 0.12 : 0.04;
      splat(accC, W, H, ax + ox, ay + oy, w);
    }

    if (!sc.img) { sc.img = ctx.createImageData(W, H); sc.u32 = new Uint32Array(sc.img.data.buffer); }
    const u32 = sc.u32, op = values.opacity, mono = values.saturation === 0 || values.colorMode === 'solid';
    for (let i = 0, n = W * H; i < n; i++) {
      const c = accC[i], t = c + accS[i];
      let v = t * op;
      if (v < 0.0005) { u32[i] = groundPx; continue; }
      if (v > 1) v = 1;
      const h = mono ? 0 : (((t - c) / t) * (HUE_STEPS - 1) + 0.5) | 0;
      u32[i] = lut[h * LEVELS + ((v * (LEVELS - 1)) | 0)];
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.putImageData(sc.img, 0, 0);

    // Wisps, bucketed by alpha; additive on the dark ground.
    const [ir, ig, ib] = inkA;
    ctx.globalCompositeOperation = values.invert ? 'source-over' : 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const NB = 24, amax = OPT.wispMax * 2, paths = [];
    for (let b = 0; b < NB; b++) paths.push(new Path2D());
    for (const w of sc.wisps) {
      const sh = 1 - 0.28 * f.mo * (1 - Math.sin(f.th * w.k + w.ph));
      const a = Math.min(1, w.a * Math.max(0, sh)) * OPT.wispMax * f.rim * op;
      if (a < 0.006) continue;
      const p = paths[Math.min(NB - 1, (a / amax * NB) | 0)];
      p.moveTo(w.pts[0][0], w.pts[0][1]);
      for (let i = 1; i < w.pts.length; i++) p.lineTo(w.pts[i][0], w.pts[i][1]);
    }
    const lw = OPT.wispW * (0.3 + 0.7 * values.stroke);
    for (let b = 0; b < NB; b++) {
      const a = ((b + 0.5) / NB) * amax;
      if (values.glow > 0) {
        ctx.lineWidth = lw + 3 * values.glow;
        ctx.strokeStyle = `rgba(${ir},${ig},${ib},${a * 0.12 * values.glow})`;
        ctx.stroke(paths[b]);
      }
      ctx.lineWidth = lw;
      ctx.strokeStyle = `rgba(${ir},${ig},${ib},${a})`;
      ctx.stroke(paths[b]);
    }
    if (values.glow > 0) {
      const R = (18 + 46 * values.glow) * sc.s;
      const grad = ctx.createRadialGradient(ax, ay, 0, ax, ay, R);
      grad.addColorStop(0, `rgba(${ir},${ig},${ib},${Math.min(1, 0.32 * values.glow * op)})`);
      grad.addColorStop(0.25, `rgba(${ir},${ig},${ib},${Math.min(1, 0.08 * values.glow * op)})`);
      grad.addColorStop(1, `rgba(${ir},${ig},${ib},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(ax - R, ay - R, 2 * R, 2 * R);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // SVG: the wisps as polylines, and an evenly thinned sample of the dots.
  const SVG_DOT_CAP = 12000;
  function exportVector() {
    const values = currentValues;
    if (!scene) return;
    const sc = scene, f = frameState(values);
    updateTau(sc, f);
    let total = 0; eachDot(sc, f, () => { total++; });
    const stride = Math.max(1, Math.ceil(total / SVG_DOT_CAP));
    const stop = (t) => { const p = paletteHsl(values, t); const [r, g, b] = hslToRgb(p.h, p.s, values.invert ? 0.12 : 0.9); return `rgb(${r},${g},${b})`; };
    const fillGas = stop(0), fillStar = stop(1), rDot = 0.35 + 0.35 * values.stroke;
    const circles = [];
    eachDot(sc, f, (kind, x, y, a, big) => {
      const o = Math.min(1, a * values.opacity);
      if (o < 0.03 || x < 0 || y < 0 || x > sc.W || y > sc.H) return;
      circles.push({ cx: x, cy: y, r: big ? rDot * 1.6 : rDot, fill: kind === 'gas' ? fillGas : fillStar, opacity: o });
    }, stride);
    circles.push({ cx: sc.anchor[0], cy: sc.anchor[1], r: 1.6, fill: fillGas, opacity: Math.min(1, values.opacity) });
    const paths = sc.wisps.filter((w) => w.a * values.rim > 0.02).map((w) => w.pts);
    exportSvg(paths, { width: canvas.width, height: canvas.height, circles });
  }

  const loop = createLoop({
    onFrame(dt, elapsed) {
      drawFrame(dt, elapsed, currentValues);
    },
  });
  loop.start();

  document.getElementById('btn-png-2x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 2 }));
  document.getElementById('btn-png-4x')?.addEventListener('click', () => exportPng(canvas, { multiplier: 4 }));
  document.getElementById('btn-svg')?.addEventListener('click', exportVector);
  document.getElementById('btn-baked')?.addEventListener('click', () => {
    bakeHtml({ sourceHtml: document.documentElement.outerHTML, values: panel.values }).catch((err) => console.error('bakeHtml failed', err));
  });
  document.getElementById('btn-source')?.addEventListener('click', () => {
    exportSource().catch((err) => console.error('exportSource failed', err));
  });
  document.getElementById('btn-prompt')?.addEventListener('click', () => {
    describeForAI({ pieceName: PIECE_ID, values: panel.values });
  });
